paths:
  data_root_dir: D:\Python projects\CUBSAT_dataset_segmentation\Fine_tuning
  raw_data_dir: D:\Python projects\CUBSAT_dataset_segmentation\train_test_split
  inference_images_dir: D:\Python projects\CUBSAT_dataset_segmentation\train_test_split\images\test
  labelme_inference_annotations_dir: D:\Python projects\CUBSAT_dataset_segmentation\train_test_split\labels\test


names:
  pt_model_name: yolo11n-seg.pt
  exported_model_name: yolo11n-seg_fine_tuned.pt
  dataset_cfg_filename: dataset.yaml
  model_hyperparameters_file: model_cfg.json
  images_extensions: ['.jpg']
  labels_extensions: ['.txt']


model_hyperparameters:
  epochs: 100
  imgsz: 1024
  batch: 4
  lr0: 0.001
  lrf: 0.005
  patience: 20
  device: 0
  optimizer: "Adam"
  freeze_layers: 10
  num_workers: 2
  dropout: 0.3
  weight_decay: 0.001
  label_smoothing: 0.1
  warmup_epochs: 3
  iou: 0.7
  cos_lr: True
  augment_params:
    fliplr: 0.5
    flipud: 0.5
    translate: 0.1
    degrees: 15
    shear: 10
    mosaic: 1.0
    mixup: 0.2
    copy_paste: 0.3
    perspective: 0.0


stages:
  - train_model
  - export_model
